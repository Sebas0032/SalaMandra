{% extends "reservas/base.html" %}
{% block title %}Iniciar sesión — SalaMandra{% endblock %}

{% block content %}
<div class="login-wrapper">
    <h1>SalaMandra</h1>
    <p class="subtitle">Ingresa a tu cuenta de SalaMandra</p>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            <label for="identificador">Código universitario</label>
            <input type="text" id="identificador" name="identificador" autocomplete="username" autofocus required>

            <label for="password" style="margin-top: 0.8rem;">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" style="margin-top: 1.1rem; width: 100%;">Ingresar</button>
        </form>
        <p class="hint">
            Usuario Administrador creado por <code>seed_data</code>:<br>
            <code>900001</code> / <code>admin123</code>
        </p>
        <p class="hint">
            ¿Eres estudiante? <a href="{% url 'registro' %}">Crear una cuenta</a>
        </p>
    </div>
</div>
{% endblock %}

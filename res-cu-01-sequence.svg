<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526174; }
      .head { fill: #e8f0ff; stroke: #3974c6; stroke-width: 2; }
      .headtext { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .life { stroke: #9aa8b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .msg { stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .ret { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#return); }
      .label { font-size: 15px; fill: #334155; }
      .frame { fill: #fff; stroke: #64748b; stroke-width: 1.8; }
      .framehead { fill: #f1f5f9; }
      .branch { font-size: 16px; font-weight: 700; }
      .note { fill: #fff7d6; stroke: #d3a72c; stroke-width: 1.5; }
      .success { fill: #e9f7ef; stroke: #27814f; stroke-width: 1.5; }
      .failure { fill: #fff0f0; stroke: #c34b4b; stroke-width: 1.5; }
      .small { font-size: 14px; }
    </style>
  </defs>
  <rect width="1700" height="1080" fill="#ffffff"/>
  <text x="850" y="48" text-anchor="middle" class="title">RES-CU-01 — Crear reserva de sala</text>
  <text x="850" y="77" text-anchor="middle" class="subtitle">Flujo propuesto según las reglas compartidas · todavía no implementado en Django</text>

  <rect x="35" y="105" width="190" height="62" rx="8" class="head"/><text x="130" y="132" class="headtext"><tspan x="130">Solicitante /</tspan><tspan x="130" dy="20">Operador / Admin</tspan></text>
  <rect x="300" y="105" width="190" height="62" rx="8" class="head"/><text x="395" y="142" class="headtext">Navegador</text>
  <rect x="565" y="105" width="190" height="62" rx="8" class="head"/><text x="660" y="132" class="headtext"><tspan x="660">Vista</tspan><tspan x="660" dy="20">Django</tspan></text>
  <rect x="830" y="105" width="190" height="62" rx="8" class="head"/><text x="925" y="132" class="headtext"><tspan x="925">Servicio</tspan><tspan x="925" dy="20">de reservas</tspan></text>
  <rect x="1095" y="105" width="190" height="62" rx="8" class="head"/><text x="1190" y="132" class="headtext"><tspan x="1190">Modelos</tspan><tspan x="1190" dy="20">Django ORM</tspan></text>
  <rect x="1360" y="105" width="190" height="62" rx="8" class="head"/><text x="1455" y="142" class="headtext">SQLite local</text>

  <line x1="130" y1="167" x2="130" y2="1025" class="life"/><line x1="395" y1="167" x2="395" y2="1025" class="life"/>
  <line x1="660" y1="167" x2="660" y2="1025" class="life"/><line x1="925" y1="167" x2="925" y2="1025" class="life"/>
  <line x1="1190" y1="167" x2="1190" y2="1025" class="life"/><line x1="1455" y1="167" x2="1455" y2="1025" class="life"/>

  <line x1="130" y1="205" x2="395" y2="205" class="msg"/><text x="262" y="194" text-anchor="middle" class="label">1. Envía código, sala, fecha, bloque y actividad</text>
  <line x1="395" y1="250" x2="660" y2="250" class="msg"/><text x="527" y="239" text-anchor="middle" class="label">2. POST con la solicitud</text>
  <line x1="660" y1="295" x2="925" y2="295" class="msg"/><text x="792" y="284" text-anchor="middle" class="label">3. crear_reserva(...)</text>
  <line x1="925" y1="340" x2="1190" y2="340" class="msg"/><text x="1057" y="329" text-anchor="middle" class="label">4. Busca código y rol en la copia local</text>
  <line x1="1190" y1="385" x2="1455" y2="385" class="msg"/><text x="1322" y="374" text-anchor="middle" class="label">SELECT usuario / rol</text>
  <line x1="1455" y1="420" x2="1190" y2="420" class="ret"/><text x="1322" y="410" text-anchor="middle" class="label">Datos locales</text>
  <line x1="1190" y1="455" x2="925" y2="455" class="ret"/><text x="1057" y="445" text-anchor="middle" class="label">Código válido, datos y permisos</text>

  <rect x="790" y="475" width="505" height="104" rx="8" class="note"/>
  <text x="810" y="502" class="label"><tspan font-weight="700">5. Valida:</tspan> sanción activa; día, feriado y apertura;</text>
  <text x="810" y="526" class="label">bloque habilitado; reserva del solicitante en bloque igual/consecutivo;</text>
  <text x="810" y="550" class="label">intervalo de limpieza de 15 minutos.</text>
  <text x="810" y="570" class="small">La universidad externa no se consulta durante esta reserva.</text>

  <rect x="430" y="610" width="1125" height="395" rx="4" class="frame"/>
  <rect x="430" y="610" width="1125" height="38" class="framehead"/>
  <text x="448" y="635" class="branch">alt — resultado del registro atómico</text>
  <text x="452" y="675" class="branch" fill="#247449">[La base registra primero esta solicitud]</text>
  <line x1="925" y1="710" x2="1190" y2="710" class="msg"/><text x="1057" y="699" text-anchor="middle" class="label">6. Inserta CONFIRMADA + ocupación por fecha</text>
  <line x1="1190" y1="750" x2="1455" y2="750" class="msg"/><text x="1322" y="739" text-anchor="middle" class="label">INSERT bajo restricción única</text>
  <line x1="1455" y1="785" x2="1190" y2="785" class="ret"/><text x="1322" y="775" text-anchor="middle" class="label">ID de reserva</text>
  <line x1="1190" y1="820" x2="925" y2="820" class="ret"/><text x="1057" y="810" text-anchor="middle" class="label">Reserva confirmada</text>
  <line x1="925" y1="850" x2="660" y2="850" class="ret"/><text x="792" y="840" text-anchor="middle" class="label">Resultado exitoso</text>
  <line x1="660" y1="880" x2="395" y2="880" class="ret"/><text x="527" y="870" text-anchor="middle" class="label">Muestra confirmación e ID</text>

  <line x1="430" y1="905" x2="1555" y2="905" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="452" y="934" class="branch" fill="#b43f3f">[Otra solicitud ya registró el mismo bloque]</text>
  <line x1="925" y1="962" x2="1190" y2="962" class="msg"/><text x="1057" y="951" text-anchor="middle" class="label">Intenta insertar la reserva</text>
  <line x1="1190" y1="990" x2="1455" y2="990" class="msg"/><text x="1322" y="980" text-anchor="middle" class="label">La restricción única rechaza</text>
  <line x1="1455" y1="1018" x2="925" y2="1018" class="ret"/><text x="1190" y="1045" text-anchor="middle" class="small">Rollback · E7 sin sanción; la reserva previa permanece</text>
  <text x="850" y="1070" text-anchor="middle" class="small" fill="#596579">Nota de diseño: la ocupación debe identificarse por sala + bloque + fecha; SalaHorario actual no tiene fecha.</text>
</svg>

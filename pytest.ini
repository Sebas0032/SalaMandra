[pytest]
testpaths = tests
pythonpath = .
# Además de test_*.py, también se descubren los archivos tests_*.py
python_files = test_*.py tests_*.py
# Las pruebas que tocan la base de datos usan la configuración de Django.
DJANGO_SETTINGS_MODULE = salamandra_project.settings
# --nomigrations: crea las tablas de prueba directo desde models.py
addopts = --nomigrations
markers =
    unit: prueba una regla, servicio o componente de forma acotada
    integration: verifica la colaboración entre ORM, base de datos, migraciones o servicios
    e2e: recorre un flujo completo mediante las vistas HTTP de Django

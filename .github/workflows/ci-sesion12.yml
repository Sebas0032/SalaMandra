
name: Sesion 12 - contrato del flujo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-flujo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener la version del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Registrar entorno y version comprobada
        run: |
          python --version
          git rev-parse HEAD

      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements.txt

      - name: Crear carpeta de evidencias
        run: mkdir -p evidencias

      - name: Comprobar el contrato del flujo
        run: python -m pytest tests/sesion12 -q --junitxml=evidencias/sesion12-junit.xml

      - name: Conservar el resultado de las pruebas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sesion12-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidencias/sesion12-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Preparar candidato de codigo fuente aprobado
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: git archive --format=zip --output="entrega-${GITHUB_SHA}.zip" HEAD

      - name: Conservar candidato para revision
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidato-sesion12-${{ github.sha }}
          path: entrega-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
